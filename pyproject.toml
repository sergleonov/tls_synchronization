[project]
name = "tls-synchronization"
version = "0.1.0"
description = "Package for numerical simulations of Broadband Cryogenic Spectroscopy. "
readme = "README.md"
authors = [
    { name = "Sergei Leonov", email = "sleonov27@amherst.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "mpmath>=1.4.1",
    "matplotlib>=3.11.0",
    "numpy>=1.26.4",
    "pyqt5>=5.15.11",
    "qutip>=5.3.1",
    "scipy>=1.17.1",
    "tqdm>=4.68.3",
    "oqupy",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
]

[project.scripts]
tls-synchronization = "tls_sync:main"

[tool.uv.sources]
oqupy = { git = "https://github.com/tempoCollaboration/OQuPy.git" }

[tool.uv.build-backend]
module-name = "tls_sync"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end tests that run full simulations (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
